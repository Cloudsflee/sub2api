name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash -n deploy/autodeploy/sub2api-autodeploy-launcher.sh
          /bin/bash -n deploy/autodeploy/sub2api-autodeploy.sh
          /bin/bash -n deploy/autodeploy/sub2api-health-restart.sh
          /bin/bash -n deploy/autodeploy/sub2api-haproxy-config.sh
          /bin/bash -n deploy/autodeploy/sub2api-blue-green-migrate.sh
          /bin/bash -n deploy/autodeploy/sub2api-backup.sh
          /bin/bash -n deploy/autodeploy/sub2api-upstream-sync.sh
          /bin/bash -n deploy/autodeploy/sub2api-upstream-sync-launcher.sh
          /bin/bash -n deploy/autodeploy/install.sh
          python3 -m py_compile deploy/autodeploy/configure-compose.py
          python3 -m py_compile deploy/autodeploy/configure-blue-green.py
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  managed-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test managed upstream sync
        run: |
          /bin/bash -n deploy/autodeploy/sub2api-upstream-sync.sh
          /bin/bash -n deploy/autodeploy/sub2api-upstream-sync-launcher.sh
          /bin/bash deploy/tests/autodeploy-launcher-test.sh
          /bin/bash deploy/tests/autodeploy-version-test.sh
          /bin/bash deploy/tests/autodeploy-migration-gate-test.sh
          /bin/bash deploy/tests/configure-blue-green-test.sh
          /bin/bash deploy/tests/haproxy-config-test.sh
          /bin/bash deploy/tests/autodeploy-hot-switch-test.sh
          /bin/bash deploy/tests/autodeploy-hot-switch-failure-test.sh
          /bin/bash deploy/tests/upstream-sync-test.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.6'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  product-sync-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: deploy/product-sync-worker/package-lock.json
      - name: Install worker dependencies
        working-directory: deploy/product-sync-worker
        run: npm ci --no-audit --no-fund
      - name: Test product sync worker
        working-directory: deploy/product-sync-worker
        run: npm test

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.6'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args: --timeout=30m
          working-directory: backend

  promote-custom-for-deployment:
    name: Mark custom commit deployable
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/custom' &&
      github.repository == 'Cloudsflee/sub2api'
    needs: [shell, managed-update, test, frontend, product-sync-worker, golangci-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fast-forward deployment ref
        run: git push origin "${GITHUB_SHA}:refs/heads/deploy/custom"
